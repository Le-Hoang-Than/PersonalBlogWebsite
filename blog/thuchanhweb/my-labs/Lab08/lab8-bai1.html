<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab8 - Bài 1</title>

    <style>
        /* Container của slideshow */
        .slide-show-container {
            position: relative;
            max-width: 1000px;
            margin: auto;
            overflow: hidden;
        }
    
        /* Mỗi slide */
        .my-slides {
            display: none;
        }
    
        /* Hiệu ứng fade */
        .fade {
            animation: fadeEffect 1s ease-in-out;
        }
    
        @keyframes fadeEffect {
            from {
                opacity: 0.4;
            }
    
            to {
                opacity: 1;
            }
        }
    
        /* Nút điều hướng */
        .prev,
        .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1;
            transition: 0.3s;
        }
    
        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }
    
        .prev:hover,
        .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    
        /* Dấu chấm điều hướng */
        .dot {
            height: 12px;
            width: 12px;
            margin: 0 4px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.4s ease;
            cursor: pointer;
        }
    
        .active,
        .dot:hover {
            background-color: #717171;
        }
    
        /* Căn giữa vùng chứa dot */
        div[text-align="center"] {
            text-align: center;
            margin-top: 10px;
        }
    </style>
        
</head>
<body>
    <div class="slide-show-container">
        <div class="my-slides fade" style="display: block;"><img src="./img/slide_1.jpg" width="100%"></div>
        <div class="my-slides fade" style="display: none;"><img src="./img/slide_2.jpg" width="100%"></div>
        <div class="my-slides fade" style="display: none;"><img src="./img/slide_3.jpg" width="100%"></div>
        <div class="my-slides fade" style="display: none;"><img src="./img/slide_4.jpg" width="100%"></div>
        <div class="my-slides fade" style="display: none;"><img src="./img/slide_5.jpg" width="100%"></div>
        <a class="prev" onclick="plusSlides(-1)"></a>
        <a class="next" onclick="plusSlides(1)"></a>
    </div>
    <br>
    <div text-align="center">
        <span class="dot active" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
        <span class="dot" onclick="currentSlide(4)"></span>
        <span class="dot" onclick="currentSlide(5)"></span>

    </div>

    <script>
        let slideIndex = 1;
        showSlides(slideIndex);

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function currentSlide(n) {
            showSlides(slideIndex = n);
        }

        function showSlides(n) {
            let i;
            let slides = document.getElementsByClassName("my-slides");
            let dots = document.getElementsByClassName("dot");
            if (n > slides.length) { slideIndex = 1 }
            if (n < 1) { slideIndex = slides.length }
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            slides[slideIndex - 1].style.display = "block";
            dots[slideIndex - 1].className += " active";
        }
    </script>
</body>
</html>
